# Core Rust (WP-02, WP-03, WP-05) : tests sur PC (Linux, Windows), libmote.so arm64-v8a par cargo-ndk, mote.h à jour.
name: core

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CORE_CRATES: -p mote-capi -p mote-core -p mote-codec -p mote-mcap -p mote-net

jobs:
  host:
    name: tests ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: astral-sh/setup-uv@v6
      - run: cargo fmt --check $CORE_CRATES
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: session MCAP lue par la bibliothèque Python mcap (critère WP-05)
        if: runner.os == 'Linux'
        run: |
          MOTE_KEEP_SESSION_DIR="$RUNNER_TEMP/mote-session" cargo test -p mote-capi --test session_file apres_stop
          uv run --project ../pc python mote-mcap/tests/check_session.py "$RUNNER_TEMP/mote-session"
      - name: build hôte (commande documentée)
        run: uv run build.py --host
      - name: mote.h versionné identique au header généré
        run: git diff --exit-code -- mote-capi/include/mote.h
      - name: test C du header et de la bibliothèque
        if: runner.os == 'Linux'
        run: |
          cc -std=c99 -Wall -Werror -Idist/include mote-capi/tests/smoke.c -Ldist/host -lmote -o smoke
          LD_LIBRARY_PATH=dist/host ./smoke
      - name: test C de la session complète (critère WP-03)
        if: runner.os == 'Linux'
        run: |
          cc -std=c99 -Wall -Werror -Idist/include mote-capi/tests/api.c -Ldist/host -lmote -lm -o api
          LD_LIBRARY_PATH=dist/host ./api "$RUNNER_TEMP/mote-api-c"

  android:
    name: libmote.so arm64-v8a
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: astral-sh/setup-uv@v6
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - run: cargo install cargo-ndk --locked
      - name: build arm64-v8a (commande documentée)
        run: uv run build.py --android --ndk "${{ steps.ndk.outputs.ndk-path }}"
      - name: vérifie l'ELF et ses dépendances
        run: |
          so=dist/android/arm64-v8a/libmote.so
          file "$so" | tee /dev/stderr | grep -q "ARM aarch64"
          readelf -d "$so" | grep NEEDED
          for f in mote_now_ns mote_create mote_start mote_stop mote_destroy mote_set_intrinsics mote_push_pair mote_push_hmd_pose mote_push_depth mote_push_event mote_get_stats mote_poll_event; do
            readelf --dyn-syms "$so" | grep -q " $f$" || { echo "symbole absent : $f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: libmote-arm64-v8a
          path: |
            core/dist/android/arm64-v8a/libmote.so
            core/dist/include/mote.h
