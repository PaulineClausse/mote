[project]
name = "mote"
version = "0.1.0"
description = "mote, côté PC : ingest, entraînement, évaluation, outils (ADR-8d03)"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "protobuf>=7.35.1,<8",      # runtime du code généré par grpcio-tools 1.84.0 (proto/README.md)
    "mcap>=1.3,<2",
    "pillow>=10",
]

[project.scripts]
mote = "mote.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mote"]

[tool.pytest.ini_options]
testpaths = ["tests"]
